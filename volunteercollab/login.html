<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - VolunteerCollab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/custom.css" />
  </head>
  <body class="font-inter bg-gray-50">
    <!-- Navigation Bar -->
    <nav class="bg-white shadow-md fixed w-full top-0 z-50">
      <div class="container mx-auto px-6 py-4">
        <div class="flex items-center justify-between">
          <a href="index.html" class="flex items-center space-x-2">
            <span class="material-icons text-teal-600 text-3xl"
              >volunteer_activism</span
            >
            <span class="text-2xl font-bold text-gray-800"
              >Volunteer<span class="text-teal-600">Collab</span></span
            >
          </a>
          <div class="hidden md:flex items-center space-x-6">
            <a href="index.html" class="nav-link">
              <span class="material-icons text-sm">home</span>Home
            </a>
            <a href="campaigns.html" class="nav-link">
              <span class="material-icons text-sm">campaign</span>Campaigns
            </a>
            <a href="ngos.html" class="nav-link">
              <span class="material-icons text-sm">groups</span>NGOs
            </a>
            <a href="login.html" class="nav-link active">
              <span class="material-icons text-sm">login</span>Login
            </a>
            <a href="register.html" class="btn-primary">Get Started</a>
          </div>
        </div>
      </div>
    </nav>

    <!-- Login Form -->
    <section class="pt-28 pb-16 min-h-screen flex items-center justify-center">
      <div class="container mx-auto px-6">
        <div class="max-w-md mx-auto">
          <div class="bg-white rounded-2xl shadow-xl p-8">
            <div class="text-center mb-8">
              <div
                class="inline-flex items-center justify-center w-16 h-16 bg-teal-100 rounded-full mb-4"
              >
                <span class="material-icons text-teal-600 text-3xl">lock</span>
              </div>
              <h2 class="text-3xl font-bold text-gray-800 mb-2">
                Welcome Back
              </h2>
              <p class="text-gray-600">Login to continue your journey</p>
            </div>

            <form id="loginForm" class="space-y-6">
              <!-- Email -->
              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2"
                  >Email Address</label
                >
                <div class="relative">
                  <span
                    class="material-icons absolute left-3 top-3 text-gray-400 text-sm"
                    >email</span
                  >
                  <input
                    type="email"
                    id="loginEmail"
                    name="email"
                    required
                    class="input-field pl-10"
                    placeholder="your@email.com"
                  />
                </div>
                <span class="error-message" id="emailError"></span>
              </div>

              <!-- Password -->
              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2"
                  >Password</label
                >
                <div class="relative">
                  <span
                    class="material-icons absolute left-3 top-3 text-gray-400 text-sm"
                    >lock</span
                  >
                  <input
                    type="password"
                    id="loginPassword"
                    name="password"
                    required
                    class="input-field pl-10"
                    placeholder="Enter your password"
                  />
                  <button
                    type="button"
                    onclick="togglePassword('loginPassword', 'toggleIcon1')"
                    class="absolute right-3 top-3 text-gray-400 hover:text-gray-600"
                  >
                    <span class="material-icons text-sm" id="toggleIcon1"
                      >visibility</span
                    >
                  </button>
                </div>
                <span class="error-message" id="passwordError"></span>
              </div>

              <!-- Remember Me & Forgot Password -->
              <div class="flex items-center justify-between">
                <label class="flex items-center">
                  <input
                    type="checkbox"
                    class="w-4 h-4 text-teal-600 border-gray-300 rounded focus:ring-teal-500"
                  />
                  <span class="ml-2 text-sm text-gray-700">Remember me</span>
                </label>
                <a
                  href="#"
                  class="text-sm text-teal-600 hover:text-teal-700 font-medium"
                  >Forgot Password?</a
                >
              </div>

              <!-- Submit Button -->
              <button type="submit" class="btn-primary w-full">
                Login
                <span class="material-icons ml-2 text-sm">arrow_forward</span>
              </button>

              <!-- Divider -->
              <div class="relative my-6">
                <div class="absolute inset-0 flex items-center">
                  <div class="w-full border-t border-gray-300"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                  <span class="px-4 bg-white text-gray-500"
                    >Or continue with</span
                  >
                </div>
              </div>

              <!-- Social Login -->
              <div class="grid grid-cols-2 gap-4">
                <button
                  type="button"
                  class="flex items-center justify-center px-4 py-3 border border-gray-300 rounded-lg hover:bg-gray-50 transition"
                >
                  <svg class="w-5 h-5 mr-2" viewBox="0 0 24 24">
                    <path
                      fill="#4285F4"
                      d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                    />
                    <path
                      fill="#34A853"
                      d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                    />
                    <path
                      fill="#FBBC05"
                      d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                    />
                    <path
                      fill="#EA4335"
                      d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                    />
                  </svg>
                  Google
                </button>
                <button
                  type="button"
                  class="flex items-center justify-center px-4 py-3 border border-gray-300 rounded-lg hover:bg-gray-50 transition"
                >
                  <svg class="w-5 h-5 mr-2" fill="#1877F2" viewBox="0 0 24 24">
                    <path
                      d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"
                    />
                  </svg>
                  Facebook
                </button>
              </div>

              <!-- Sign Up Link -->
              <p class="text-center text-sm text-gray-600 mt-6">
                Don't have an account?
                <a
                  href="register.html"
                  class="text-teal-600 hover:text-teal-700 font-semibold"
                  >Sign Up</a
                >
              </p>
            </form>
          </div>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="bg-gray-900 text-gray-300 py-8">
      <div class="container mx-auto px-6 text-center">
        <p class="text-sm">© 2026 VolunteerCollab. All rights reserved.</p>
      </div>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/validation.js"></script>
  </body>
</html>
