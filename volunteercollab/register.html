<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - VolunteerCollab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/custom.css" />
  </head>
  <body class="font-inter bg-gray-50">
    <!-- Navigation Bar -->
    <nav class="bg-white shadow-md fixed w-full top-0 z-50">
      <div class="container mx-auto px-6 py-4">
        <div class="flex items-center justify-between">
          <a href="index.html" class="flex items-center space-x-2">
            <span class="material-icons text-teal-600 text-3xl"
              >volunteer_activism</span
            >
            <span class="text-2xl font-bold text-gray-800"
              >Volunteer<span class="text-teal-600">Collab</span></span
            >
          </a>
          <div class="hidden md:flex items-center space-x-6">
            <a href="index.html" class="nav-link">
              <span class="material-icons text-sm">home</span>Home
            </a>
            <a href="campaigns.html" class="nav-link">
              <span class="material-icons text-sm">campaign</span>Campaigns
            </a>
            <a href="ngos.html" class="nav-link">
              <span class="material-icons text-sm">groups</span>NGOs
            </a>
            <a href="login.html" class="nav-link">
              <span class="material-icons text-sm">login</span>Login
            </a>
          </div>
        </div>
      </div>
    </nav>

    <!-- Registration Form -->
    <section class="pt-28 pb-16">
      <div class="container mx-auto px-6">
        <div class="max-w-2xl mx-auto">
          <div class="bg-white rounded-2xl shadow-xl p-8">
            <div class="text-center mb-8">
              <div
                class="inline-flex items-center justify-center w-16 h-16 bg-teal-100 rounded-full mb-4"
              >
                <span class="material-icons text-teal-600 text-3xl"
                  >person_add</span
                >
              </div>
              <h2 class="text-3xl font-bold text-gray-800 mb-2">
                Create Account
              </h2>
              <p class="text-gray-600">
                Join our community and start making a difference
              </p>
            </div>

            <form id="registerForm" class="space-y-6">
              <!-- Role Selection -->
              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-3"
                  >I want to join as:</label
                >
                <div class="grid grid-cols-2 gap-4">
                  <label class="role-card">
                    <input
                      type="radio"
                      name="role"
                      value="volunteer"
                      checked
                      class="hidden"
                    />
                    <div class="role-card-content">
                      <span class="material-icons text-4xl mb-2 text-teal-600"
                        >volunteer_activism</span
                      >
                      <span class="font-semibold">Volunteer</span>
                    </div>
                  </label>
                  <label class="role-card">
                    <input
                      type="radio"
                      name="role"
                      value="ngo"
                      class="hidden"
                    />
                    <div class="role-card-content">
                      <span class="material-icons text-4xl mb-2 text-teal-600"
                        >business</span
                      >
                      <span class="font-semibold">NGO</span>
                    </div>
                  </label>
                </div>
              </div>

              <!-- Full Name -->
              <div class="grid md:grid-cols-2 gap-4">
                <div>
                  <label class="block text-sm font-semibold text-gray-700 mb-2"
                    >First Name</label
                  >
                  <input
                    type="text"
                    id="firstName"
                    name="firstName"
                    required
                    class="input-field"
                    placeholder="John"
                  />
                  <span class="error-message" id="firstNameError"></span>
                </div>
                <div>
                  <label class="block text-sm font-semibold text-gray-700 mb-2"
                    >Last Name</label
                  >
                  <input
                    type="text"
                    id="lastName"
                    name="lastName"
                    required
                    class="input-field"
                    placeholder="Doe"
                  />
                  <span class="error-message" id="lastNameError"></span>
                </div>
              </div>

              <!-- Email -->
              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2"
                  >Email Address</label
                >
                <div class="relative">
                  <span
                    class="material-icons absolute left-3 top-3 text-gray-400 text-sm"
                    >email</span
                  >
                  <input
                    type="email"
                    id="registerEmail"
                    name="email"
                    required
                    class="input-field pl-10"
                    placeholder="your@email.com"
                  />
                </div>
                <span class="error-message" id="regEmailError"></span>
              </div>

              <!-- Phone -->
              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2"
                  >Phone Number</label
                >
                <div class="relative">
                  <span
                    class="material-icons absolute left-3 top-3 text-gray-400 text-sm"
                    >phone</span
                  >
                  <input
                    type="tel"
                    id="phone"
                    name="phone"
                    required
                    class="input-field pl-10"
                    placeholder="+91 98765 43210"
                  />
                </div>
                <span class="error-message" id="phoneError"></span>
              </div>

              <!-- Department/Organization (Changes based on role) -->
              <div id="volunteerFields">
                <label class="block text-sm font-semibold text-gray-700 mb-2"
                  >Department/Group</label
                >
                <select id="department" name="department" class="input-field">
                  <option value="">Select Department</option>
                  <option value="nss">NSS Volunteers</option>
                  <option value="ncc">NCC Cadets</option>
                  <option value="nature">Nature Club</option>
                  <option value="cs">Computer Science Dept</option>
                  <option value="commerce">Commerce Dept</option>
                  <option value="arts">Arts Dept</option>
                </select>

                <label
                  class="block text-sm font-semibold text-gray-700 mb-2 mt-4"
                  >Skills (Select multiple)</label
                >
                <div class="grid grid-cols-2 gap-2">
                  <label class="flex items-center">
                    <input
                      type="checkbox"
                      name="skills"
                      value="photography"
                      class="w-4 h-4 text-teal-600 border-gray-300 rounded"
                    />
                    <span class="ml-2 text-sm text-gray-700">Photography</span>
                  </label>
                  <label class="flex items-center">
                    <input
                      type="checkbox"
                      name="skills"
                      value="first-aid"
                      class="w-4 h-4 text-teal-600 border-gray-300 rounded"
                    />
                    <span class="ml-2 text-sm text-gray-700">First Aid</span>
                  </label>
                  <label class="flex items-center">
                    <input
                      type="checkbox"
                      name="skills"
                      value="public-speaking"
                      class="w-4 h-4 text-teal-600 border-gray-300 rounded"
                    />
                    <span class="ml-2 text-sm text-gray-700"
                      >Public Speaking</span
                    >
                  </label>
                  <label class="flex items-center">
                    <input
                      type="checkbox"
                      name="skills"
                      value="social-media"
                      class="w-4 h-4 text-teal-600 border-gray-300 rounded"
                    />
                    <span class="ml-2 text-sm text-gray-700">Social Media</span>
                  </label>
                  <label class="flex items-center">
                    <input
                      type="checkbox"
                      name="skills"
                      value="teaching"
                      class="w-4 h-4 text-teal-600 border-gray-300 rounded"
                    />
                    <span class="ml-2 text-sm text-gray-700">Teaching</span>
                  </label>
                  <label class="flex items-center">
                    <input
                      type="checkbox"
                      name="skills"
                      value="technical"
                      class="w-4 h-4 text-teal-600 border-gray-300 rounded"
                    />
                    <span class="ml-2 text-sm text-gray-700">Technical</span>
                  </label>
                </div>
              </div>

              <div id="ngoFields" class="hidden">
                <label class="block text-sm font-semibold text-gray-700 mb-2"
                  >Organization Name</label
                >
                <input
                  type="text"
                  id="orgName"
                  name="orgName"
                  class="input-field"
                  placeholder="Your Organization Name"
                />

                <label
                  class="block text-sm font-semibold text-gray-700 mb-2 mt-4"
                  >Category</label
                >
                <select id="category" name="category" class="input-field">
                  <option value="">Select Category</option>
                  <option value="environment">Environment</option>
                  <option value="education">Education</option>
                  <option value="healthcare">Healthcare</option>
                  <option value="poverty">Poverty</option>
                  <option value="human-rights">Human Rights</option>
                </select>
              </div>

              <!-- Password -->
              <div class="grid md:grid-cols-2 gap-4">
                <div>
                  <label class="block text-sm font-semibold text-gray-700 mb-2"
                    >Password</label
                  >
                  <div class="relative">
                    <span
                      class="material-icons absolute left-3 top-3 text-gray-400 text-sm"
                      >lock</span
                    >
                    <input
                      type="password"
                      id="registerPassword"
                      name="password"
                      required
                      class="input-field pl-10"
                      placeholder="Create password"
                    />
                    <button
                      type="button"
                      onclick="
                        togglePassword('registerPassword', 'toggleIcon2')
                      "
                      class="absolute right-3 top-3 text-gray-400 hover:text-gray-600"
                    >
                      <span class="material-icons text-sm" id="toggleIcon2"
                        >visibility</span
                      >
                    </button>
                  </div>
                  <span class="error-message" id="regPasswordError"></span>
                </div>
                <div>
                  <label class="block text-sm font-semibold text-gray-700 mb-2"
                    >Confirm Password</label
                  >
                  <div class="relative">
                    <span
                      class="material-icons absolute left-3 top-3 text-gray-400 text-sm"
                      >lock</span
                    >
                    <input
                      type="password"
                      id="confirmPassword"
                      name="confirmPassword"
                      required
                      class="input-field pl-10"
                      placeholder="Confirm password"
                    />
                    <button
                      type="button"
                      onclick="togglePassword('confirmPassword', 'toggleIcon3')"
                      class="absolute right-3 top-3 text-gray-400 hover:text-gray-600"
                    >
                      <span class="material-icons text-sm" id="toggleIcon3"
                        >visibility</span
                      >
                    </button>
                  </div>
                  <span class="error-message" id="confirmPasswordError"></span>
                </div>
              </div>

              <!-- Terms & Conditions -->
              <div>
                <label class="flex items-start">
                  <input
                    type="checkbox"
                    id="terms"
                    required
                    class="w-4 h-4 text-teal-600 border-gray-300 rounded mt-1"
                  />
                  <span class="ml-2 text-sm text-gray-700">
                    I agree to the
                    <a
                      href="#"
                      class="text-teal-600 hover:text-teal-700 font-medium"
                      >Terms & Conditions</a
                    >
                    and
                    <a
                      href="#"
                      class="text-teal-600 hover:text-teal-700 font-medium"
                      >Privacy Policy</a
                    >
                  </span>
                </label>
                <span class="error-message" id="termsError"></span>
              </div>

              <!-- Submit Button -->
              <button type="submit" class="btn-primary w-full">
                Create Account
                <span class="material-icons ml-2 text-sm">arrow_forward</span>
              </button>

              <!-- Login Link -->
              <p class="text-center text-sm text-gray-600 mt-6">
                Already have an account?
                <a
                  href="login.html"
                  class="text-teal-600 hover:text-teal-700 font-semibold"
                  >Login</a
                >
              </p>
            </form>
          </div>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="bg-gray-900 text-gray-300 py-8">
      <div class="container mx-auto px-6 text-center">
        <p class="text-sm">© 2026 VolunteerCollab. All rights reserved.</p>
      </div>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/validation.js"></script>
  </body>
</html>
